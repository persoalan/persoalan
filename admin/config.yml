
backend:
  name: github
  repo: persoalan/persoalan
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "ms"

collections:
  - name: "artikel"
    label: "Artikel"
    folder: "content/artikel"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tajuk", name: "title", widget: "string" }
      - { label: "Tarikh", name: "date", widget: "datetime" }
      
      - label: "Kategori"
        name: "category"
        widget: "relation"
        collection: "kategori"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "name"
      - { label: "Ringkasan", name: "description", widget: "text" }
      - { label: "Gambar", name: "image", widget: "image", required: false }
      - { label: "Kandungan", name: "body", widget: "markdown" } 
  - name: "kategori"
    label: "Kategori"
    folder: "content/kategori"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Nama Kategori", name: "name", widget: "string" }
      - { label: "Penerangan", name: "description", widget: "text" }
      - { label: "Kandungan Pengenalan", name: "body", widget: "markdown", required: false }
  - name: "halaman"
    label: "Halaman"
    folder: "content/halaman"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tajuk Halaman", name: "title", widget: "string" }
      - { label: "Ringkasan SEO", name: "description", widget: "text" }
      - { label: "Gambar Utama", name: "image", widget: "image", required: false }
      - { label: "Kandungan", name: "body", widget: "markdown" }


